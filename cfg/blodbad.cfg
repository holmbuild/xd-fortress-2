// Provspela blodbadet: skriv "exec blodbad" i konsolen (efter att moddet startat).
// Varje runda blir ett blodbad, botarna fyller upp till 6 gladiatorer och banan laddas.
// Tillbaka till vanlig turordning: tf_gladiator_format 0 (eller starta om spelet).
tf_gladiator_format 3
tf_gladiator_min_players 6
map xd_colosseum
