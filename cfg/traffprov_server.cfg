// Träffprov med spelare på den dedikerade servern (27/10). Skriv "exec traffprov_server" i serverns fönster
// (Starta_dedikerad_server.cmd) när banan xd_colosseum är igång. Alla tål nästan allt och inget kapas,
// så ni kan hugga på varandra länge. Varje hugg från alla loggas i server\mod_tf\traffprov_server.log.
// Byt vapen: varje spelare skriver i sin konsol tf_gladiator_testtype 0-4
//   (0 svärd, 1 securifer, 2 sica, 3 treudd, 4 dubbel).
// Botar: inga (tf_gladiator_min_players 0); skriv tf_gladiator_min_players 4 i serverfönstret för botar.
// Klart: "exec traffprov_server_slut" i serverfönstret.
con_logfile traffprov_server.log
echo TP_START
sv_cheats 1
tf_gladiator_debug 1
tf_gladiator_format 1
tf_gladiator_lives 0
tf_gladiator_spawn_protect 0
tf_gladiator_health 100000
tf_gladiator_min_players 0
tf_ragdoll_dismember 0
mp_restartgame 1
echo "Traffprov server: hugg pa varandra, exec traffprov_server_slut nar ni ar klara."
