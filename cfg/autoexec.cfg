con_enable 1
bind "v" "voicemenu 0 0"
bind "o" "ragdoll"
bind "p" "thirdperson_toggle"
// Ingen väntan när banan startar ("Waiting for players") och ingen frysning i början av rundan
mp_waitingforplayers_time 0
mp_enableroundwaittime 0
// Servern går i värdens spel: sov inte när fönstret tappar fokus, annars laggar alla andra
engine_no_focus_sleep 0
// Ragdolls är server-entiteter och syns med nätets fördröjning: 20 uppdateringar + 100 ms utjämning kändes som
// input-lag i bytet till ragdoll. 66/66 och utjämning 2 rutor ger cirka 30 ms.
cl_updaterate 66
cl_cmdrate 66
cl_interp 0
cl_interp_ratio 2
rate 100000
