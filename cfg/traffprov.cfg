// Träffprov för spelaren (27/10). Starta xd_colosseum som vanligt, välj klass, skriv sedan "exec traffprov" i konsolen.
// Botarna står still och tål nästan allt (du också), ingen kapning, ingen spawnskydd. Allt loggas i traffprov.log.
//   rad   = alla botar i en rad 70 enheter framför dig (rad50, rad90 för andra avstånd)
//   v0..v4 = byt vapen: v0 murmillo (svärd), v1 securifer, v2 thraex (sica), v3 retiarius (treudd), v4 dimachaerus (dubbel)
//   fri   = botarna börjar slåss på riktigt (vanligt liv), för att prova i strid
//   blind = nästa runda i en blind jämförelse: servern väljer gammalt eller nytt blad utan att säga vilket
//           (sex rundor, tre av varje; skriv blind, hugg en stund, blind igen ...)
//   klart = slutar logga och ställer tillbaka allt
con_logfile traffprov.log
echo TP_START
sv_cheats 1
tf_gladiator_debug 1
tf_gladiator_format 1
tf_gladiator_lives 0
tf_gladiator_spawn_protect 0
tf_gladiator_health 100000
tf_gladiator_bot_type 1
tf_gladiator_bot_stand 1
tf_gladiator_min_players 4
tf_ragdoll_dismember 0
alias rad "tf_gladiator_bot_line 70; echo TP_BOT 70"
alias rad50 "tf_gladiator_bot_line 50; echo TP_BOT 50"
alias rad90 "tf_gladiator_bot_line 90; echo TP_BOT 90"
alias v0 "tf_gladiator_testtype 0; echo TP_VAPEN 0"
alias v1 "tf_gladiator_testtype 1; echo TP_VAPEN 1"
alias v2 "tf_gladiator_testtype 2; echo TP_VAPEN 2"
alias v3 "tf_gladiator_testtype 3; echo TP_VAPEN 3"
alias v4 "tf_gladiator_testtype 4; echo TP_VAPEN 4"
alias fri "echo TP_FRI; tf_gladiator_health 200; tf_gladiator_bot_stand 0; tf_gladiator_bot_type -1; tf_ragdoll_dismember 1; mp_restartgame 1"
alias blind "tf_gladiator_blind_next; echo Ny runda - hugg pa!"
alias klart "exec traffprov_slut"
mp_restartgame 1
echo "Traffprov: skriv rad, sedan v0-v4 for vapen, blind for blind jamforelse, fri for strid och klart nar du ar fardig."
